[project]
name = "myapp"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "pre-commit>=4.0",
    "pyright>=1.1",
    "ruff>=0.11",
    "rumdl>=0.1.72",
    "taskipy>=1.14",
    "ty>=0.0.26",
]

test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
show-fixes = true
force-exclude = true
fix = true
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
preview = false
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "PTH", "LOG", "G"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ty.rules]
all = "error"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["build", "dist", ".venv"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[tool.taskipy.tasks]
fmt = "ruff format ."
lint = "ruff check . --fix"
type = "ty check src && pyright"
test = "pytest -v"
mdlint = "rumdl check ."
sec = "bandit -r src"
check = "task fmt && task lint && task type && task mdlint && task test"
