# rumdl configuration file
# See: https://github.com/rvben/rumdl#configuration

[rules]
select = []
ignore = []

[rules.MD013]
line_length = 0
code_blocks = false
tables = false

[rules.MD003]
style = "atx"

[rules.MD007]
indent = 4

[files]
include = ["**/*.md", "**/*.markdown"]
exclude = ["node_modules/**", "target/**", "build/**", "dist/**"]

[MD060]
enabled = true
style = "aligned"
