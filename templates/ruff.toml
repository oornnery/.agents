# ruff.toml — Linter and formatter configuration
# Docs: https://docs.astral.sh/ruff/configuration/
# Rules: https://docs.astral.sh/ruff/rules/
# Run:  uv run ruff check . && uv run ruff format .

# ── Global ────────────────────────────────────────────────────────────────────

line-length = 100
indent-width = 4
target-version = "py312"

# Enable safe auto-fixes by default.
# Unsafe fixes must be applied explicitly with: ruff check --unsafe-fixes
fix = true

# ── File selection ─────────────────────────────────────────────────────────────

extend-exclude = [
    ".venv",
    "__pycache__",
    "*.pyi",
    "migrations",         # database migration files (auto-generated)
    "alembic/versions",   # alembic migrations (auto-generated)
]

# ── Linter ────────────────────────────────────────────────────────────────────

[lint]

# Rule prefix reference:
#   E / W   pycodestyle             — style errors and warnings
#   F       pyflakes                — undefined names, unused imports
#   I       isort                   — import ordering
#   N       pep8-naming             — naming conventions
#   UP      pyupgrade               — modernize syntax (f-strings, type hints)
#   B       flake8-bugbear          — bugs and design issues
#   C4      flake8-comprehensions   — unnecessary comprehension patterns
#   SIM     flake8-simplify         — simplifiable code
#   S       flake8-bandit           — security (see per-file-ignores for tests)
#   G       flake8-logging-format   — logging best practices
#   PT      flake8-pytest-style     — pytest conventions
#   RUF     ruff-specific           — opinionated Python improvements
#   PERF    perflint                — performance anti-patterns
#   TID     flake8-tidy-imports     — banned imports, relative imports
#   TCH     flake8-type-checking    — TYPE_CHECKING guard for type-only imports
#   LOG     flake8-logging          — logging anti-patterns (avoid redundant exc_info)

select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "G",    # flake8-logging-format
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
    "PERF", # perflint
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "LOG",  # flake8-logging
]

ignore = [
    # ── pycodestyle ────────────────────────────────────────────────────────────
    "E501",    # line too long — enforced by formatter instead

    # ── flake8-bugbear ────────────────────────────────────────────────────────
    "B008",    # function call in default argument
               # conflicts with FastAPI Depends() in function signatures
    "B904",    # raise ... from ... inside except block — sometimes intentional

    # ── flake8-simplify ───────────────────────────────────────────────────────
    "SIM108",  # ternary operator — readability depends on context

    # ── flake8-bandit ─────────────────────────────────────────────────────────
    "S101",    # use of assert — valid in tests and domain invariants
    "S104",    # binding to 0.0.0.0 — expected in containerized services
    "S603",    # subprocess without shell=True — usually safe with explicit args
    "S607",    # partial executable path in subprocess — context-dependent

    # ── ruff-specific ─────────────────────────────────────────────────────────
    "RUF012",  # mutable class-variable default — project convention varies
]

# Do not auto-fix these even when --fix is active.
# Fixes for these rules can silently change behavior.
unfixable = [
    "B",   # bugbear: fixes may alter semantics
    "SIM", # simplify: condensed form can obscure intent
    "F841", # local variable assigned but never used — may be intentional
]

per-file-ignores = { "tests/**/*.py" = ["S", "ANN", "D", "PT"], "src/**/cli.py" = ["T201"], "scripts/**/*.py" = ["S", "T201"], "**/__init__.py" = ["F401"], "**/settings*.py" = ["S105", "S106"] }

# ── isort ─────────────────────────────────────────────────────────────────────

[lint.isort]
known-first-party = ["myapp"]   # replace with your package name
force-single-line = false
split-on-trailing-comma = true
combine-as-imports = true

# ── pep8-naming ────────────────────────────────────────────────────────────────

[lint.pep8-naming]
# Short loop variable names and common single-letter names to allow
ignore-names = ["i", "j", "k", "n", "x", "y", "e", "f", "_"]

# ── flake8-bugbear ────────────────────────────────────────────────────────────

[lint.flake8-bugbear]
# Callables whose return values are safe to use as default argument values
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "typer.Option",
    "typer.Argument",
]

# ── flake8-type-checking ──────────────────────────────────────────────────────

[lint.flake8-type-checking]
# These base classes need their annotations available at runtime (Pydantic
# and SQLModel evaluate annotations to build models and validators).
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlmodel.SQLModel",
]
runtime-evaluated-decorators = [
    "attrs.define",
    "attrs.frozen",
]

# ── flake8-pytest-style ───────────────────────────────────────────────────────

[lint.flake8-pytest-style]
fixture-parentheses = false       # prefer @pytest.fixture over @pytest.fixture()
mark-parentheses = false          # prefer @pytest.mark.slow over @pytest.mark.slow()
parametrize-names-type = "tuple"  # prefer tuple unpacking in parametrize

# ── mccabe complexity ─────────────────────────────────────────────────────────

[lint.mccabe]
max-complexity = 10  # flag functions exceeding cyclomatic complexity of 10

# ── Formatter ─────────────────────────────────────────────────────────────────

[format]
quote-style = "single"            # single quotes throughout
indent-style = "space"
skip-magic-trailing-comma = false # preserve trailing commas in multiline collections
line-ending = "auto"              # normalize line endings
docstring-code-format = true      # format code blocks inside docstrings
