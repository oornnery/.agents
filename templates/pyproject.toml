[project]
name = "myapp"
version = "0.0.1"
description = "My Python application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.11", "ty>=0.0.26", "pre-commit>=4.0", "taskipy>=1.14"]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.0",
    "pytest-mock>=3.0",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"
fix = true
extend-exclude = ["build", "dist", ".venv", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.rules]
all = "error"
possibly-unbound-attribute = "warn"
possibly-unresolved-reference = "warn"
index-out-of-bounds = "ignore"

[tool.ty.src]
include = ["src", "tests"]
exclude = ["build", "dist", ".venv"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: long-running tests",
    "integration: integration-level tests",
    "e2e: end-to-end flow tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.taskipy.tasks]
format = "ruff format ."
lint = "ruff check . --fix"
lint-check = "ruff check ."
typecheck = "ty check"
test = "pytest"
check = "task lint-check && task typecheck && task test"
fix = "task format && task lint"
